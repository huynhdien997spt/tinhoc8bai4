<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 9 · An toàn trên không gian mạng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0b1c33; --navy-800:#0f2440; --navy-700:#15325a;
  --cyan:#22d3ee; --cyan-dark:#0891b2;
  --safe:#22c55e; --safe-dark:#15803d;
  --warn:#f5b73d; --warn-dark:#b5790a;
  --danger:#ef4444; --danger-dark:#b91c1c;
  --paper:#f3f6fb; --card:#ffffff; --ink:#0f2440; --ink-soft:#4a5b73;
  --border:#dbe4f0;
  --radius:14px;
  --font-ui:'Be Vietnam Pro',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);-webkit-tap-highlight-color:transparent}
body{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);line-height:1.5}
img,svg{max-width:100%}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-ui);margin:0 0 .5em;line-height:1.25}
p{margin:0 0 1em}
.hidden{display:none !important}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--navy-900);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.topbar .brand span.badge{background:var(--cyan);color:var(--navy-900);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.topbar .spacer{flex:1}
.topbar .stat{font-size:13px;background:rgba(255,255,255,.08);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px}
.progressbar-outer{height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.progressbar-inner{height:100%;background:linear-gradient(90deg,var(--cyan),var(--safe));border-radius:99px;transition:width .4s ease}
.btn{border:none;border-radius:10px;padding:12px 18px;font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn-primary{background:var(--navy-800);color:#fff}
.btn-primary:hover{background:var(--navy-700)}
.btn-cyan{background:var(--cyan);color:var(--navy-900)}
.btn-outline{background:#fff;color:var(--navy-800);border:2px solid var(--border)}
.btn-safe{background:var(--safe);color:#06280f}
.btn-warn{background:var(--warn);color:#3a2600}
.btn-danger{background:var(--danger);color:#fff}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],textarea{font-family:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:2px solid var(--border);min-height:44px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:88px;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible,.choice:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,36,64,.04)}
.card h3{font-size:18px}
.eyebrow{font-size:13px;color:var(--cyan-dark);font-weight:700;letter-spacing:.2px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:720px){.grid3{grid-template-columns:1fr 1fr 1fr}}
.choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--border);border-radius:12px;padding:14px 16px;font-size:15px;font-weight:500;min-height:44px;color:var(--ink)}
.choice:hover{border-color:var(--cyan-dark)}
.choice.selected{border-color:var(--cyan-dark);background:#eafcff}
.choice.correct{border-color:var(--safe);background:#eafcf1}
.choice.correct::after{content:" ✅";}
.choice.incorrect{border-color:var(--danger);background:#fdeeee}
.choice.incorrect::after{content:" 🔍";}
.feedback{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:500}
.feedback.ok{background:#eafcf1;color:var(--safe-dark);border:1px solid var(--safe)}
.feedback.hint{background:#fff8e8;color:var(--warn-dark);border:1px solid var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--navy-900);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.pill.safe{background:var(--safe)}
.pill.warn{background:var(--warn);color:#3a2600}
.pill.danger{background:var(--danger)}
.zone{border:2px dashed var(--border);border-radius:12px;padding:12px;min-height:90px}
.zone.active-target{border-color:var(--cyan-dark);background:#eafcff}
.zone h4{margin:0 0 8px;font-size:14px}
.tag{display:inline-flex;align-items:center;background:#fff;border:2px solid var(--border);border-radius:10px;padding:8px 12px;margin:4px;font-size:14px;font-weight:600}
.tag.picked{outline:3px solid var(--cyan);outline-offset:1px}
.tag.placed{opacity:.55}
.msg-bubble{background:#eef3fa;border-radius:14px 14px 14px 2px;padding:12px 14px;margin:8px 0;max-width:85%;font-size:14.5px}
.msg-bubble.link{border-left:4px solid var(--danger)}
.chat-frame{background:#dfe9f5;border-radius:16px;padding:14px}
.post-card{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfdff}
.post-meta{font-size:12px;color:var(--ink-soft);margin-bottom:6px}
.checklist-item{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}
.progress-steps{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.progress-step{flex:1;min-width:36px;height:6px;border-radius:99px;background:var(--border)}
.progress-step.done{background:var(--safe)}
.progress-step.now{background:var(--cyan)}
/* ---- Windows Security lab ---- */
.wsec-window{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--border);box-shadow:0 8px 24px rgba(15,36,64,.12)}
.wsec-titlebar{background:#0067b8;color:#fff;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:8px}
.wsec-body{display:flex;flex-wrap:wrap}
.wsec-nav{background:#f3f3f3;min-width:170px;flex:1 1 170px;padding:10px}
.wsec-nav div{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:4px;color:#333}
.wsec-nav div.active{background:#e6f2fb;color:#0067b8;font-weight:700}
.wsec-content{flex:3 1 320px;padding:16px;min-width:240px}
.scan-progress-outer{height:14px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}
.scan-progress-inner{height:100%;background:#0067b8;width:0%;transition:width .3s linear}
.scan-file-row{font-family:var(--font-mono);font-size:13px;padding:3px 0;color:#333}
/* ---- malware sim ---- */
.sim-track{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0;flex-wrap:wrap}
.sim-node{width:78px;height:78px;border-radius:16px;background:#eef3fa;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;transition:all .3s ease}
.sim-node.infected{background:#fdeeee;border-color:var(--danger)}
.sim-arrow{font-size:22px;color:var(--ink-soft)}
/* ---- exit ticket / mindmap ---- */
.emoji-scale{display:flex;gap:8px;flex-wrap:wrap}
.emoji-scale button{font-size:26px;background:#fff;border:2px solid var(--border);border-radius:12px;padding:8px 14px;min-height:44px}
.emoji-scale button.selected{border-color:var(--cyan-dark);background:#eafcff}
/* ---- modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(11,28,51,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-box{background:#fff;border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.modal-box.wide{max-width:960px}
/* ---- toast / sync ---- */
#syncBadge{position:fixed;bottom:14px;left:14px;background:var(--navy-900);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;z-index:60;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
/* ---- teacher table ---- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:#f3f6fb;position:sticky;top:0}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.stat-card .num{font-size:24px;font-weight:800;color:var(--navy-800)}
.stat-card .lbl{font-size:12.5px;color:var(--ink-soft)}
.link-list a{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;color:var(--navy-800);text-decoration:none;font-size:14px;font-weight:600}
.link-list a:hover{border-color:var(--cyan-dark);background:#eafcff}
.xp-toast{position:fixed;top:70px;right:14px;background:var(--cyan);color:var(--navy-900);padding:10px 16px;border-radius:12px;font-weight:700;z-index:90;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:xpIn .3s ease}
@keyframes xpIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important;transition-duration:.001s !important}}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slider-row label{flex:0 0 130px;margin:0;font-size:13.5px}
.slider-row input[type=range]{flex:1}
.slider-row .val{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
footer.note{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
.small{font-size:13px;color:var(--ink-soft)}
</style>
</head>
<body>

<div class="topbar" role="banner">
  <div class="brand">🛡️ <span id="lessonNameLabel">Bài 9</span> <span class="badge" id="demoBadge" style="display:none">DEMO MODE</span></div>
  <div class="progressbar-outer" id="topProgressOuter" style="display:none"><div class="progressbar-inner" id="topProgressInner" style="width:0%"></div></div>
  <div class="stat" id="xpStat" style="display:none">⭐ <span id="xpVal">0</span> XP</div>
  <div class="spacer"></div>
  <button class="btn btn-outline" id="teacherBtn" style="padding:8px 12px;font-size:13px;min-height:36px">👨‍🏫 Teacher Mode</button>
</div>

<div id="app" class="wrap"></div>
<div id="syncBadge" class="hidden">☁ Đang chờ đồng bộ</div>

<script>
/* =========================================================
   CONFIG
========================================================= */
const CONFIG = {
  lessonId: "TIN10_BAI9",
  lessonName: "Bài 9. An toàn trên không gian mạng",
  subject: "Tin học",
  grade: "10",
  teacherName: "Huỳnh Văn Diễn",
  schoolYear: "2026-2027",
  expectedMinutes: 90,
  fastFinishMinutes: 10,
  teacherCode: "GV2026",
  googleScriptUrl: "https://script.google.com/macros/s/AKfycbz4Y2UCvIybr-TKBkoc4UPeOXoU6xK7Y4iANu6cqScWdSr74qEa3wpKk5bePXeBcVet/exec"
};
const DEMO_MODE = !CONFIG.googleScriptUrl || CONFIG.googleScriptUrl.indexOf("PASTE_") === 0;

const DEMO_STUDENTS = [

];

document.getElementById('lessonNameLabel').textContent = CONFIG.lessonName.replace(/^Bài\s*\d+\.\s*/,'Bài '+CONFIG.lessonId.split('BAI')[1]+' · ');
if(DEMO_MODE) document.getElementById('demoBadge').style.display='inline-block';

/* =========================================================
   STATE
========================================================= */
let S = {
  studentId:null, hoTen:null, lop:null, studentKey:null,
  page:'checkin',
  startTime:null, lastActivity:null,
  completedActivities:{}, // activityId -> {answer,correct,score,xp,attempts,time}
  score:0, xp:0,
  mindmap:{"Nguy cơ":[],"Malware":[],"Phòng tránh":[]},
  exitTicket:null,
  completeTime:null
};

const REQUIRED_ACTIVITIES = [
  "B9_RISK_MESSAGE","B9_FAKE_NEWS","B9_PRIVACY_SORT",
  "B9_CYBERBULLYING","B9_DATA_SAFE","B9_BALANCE",
  "B9_VIRUS_SIM","B9_WORM_SIM","B9_TROJAN_SIM","B9_MALWARE_CLASSIFY",
  "B9_SAFE_DOWNLOAD","B9_DEFENDER_SCAN",
  "B9_FINAL_CHALLENGE","B9_EXIT_TICKET","B9_MINDMAP"
];

function storageKey(){ return "b9_progress_"+S.studentKey; }
function saveLocal(){
  try{ localStorage.setItem(storageKey(), JSON.stringify(S)); }catch(e){}
}
function loadLocal(key){
  try{ const raw = localStorage.getItem("b9_progress_"+key); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}

/* =========================================================
   API LAYER (works for real Apps Script + offline queue)
========================================================= */
function apiGetUrl(params){
  const qs = Object.keys(params).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  return CONFIG.googleScriptUrl + '?' + qs;
}
async function apiGet(params){
  if(DEMO_MODE) throw new Error('demo-mode');
  const res = await fetch(apiGetUrl(params));
  return await res.json();
}
function queueSync(action, payload){
  let q = [];
  try{ q = JSON.parse(localStorage.getItem('b9_syncQueue')||'[]'); }catch(e){ q=[]; }
  const dedupeKey = action+'|'+(payload.studentKey||'')+'|'+(payload.activityId||'');
  q = q.filter(it => (it.action+'|'+(it.payload.studentKey||'')+'|'+(it.payload.activityId||'')) !== dedupeKey);
  q.push({id:Date.now()+'_'+Math.random().toString(36).slice(2), action, payload});
  localStorage.setItem('b9_syncQueue', JSON.stringify(q));
  updateSyncBadge();
}
function updateSyncBadge(){
  let q = [];
  try{ q = JSON.parse(localStorage.getItem('b9_syncQueue')||'[]'); }catch(e){}
  const el = document.getElementById('syncBadge');
  if(q.length>0){ el.classList.remove('hidden'); el.textContent = '☁ Đang chờ đồng bộ ('+q.length+')'; }
  else{ el.classList.add('hidden'); }
}
async function apiPost(action, payload){
  if(DEMO_MODE){ return {ok:true, demo:true}; }
  try{
    const res = await fetch(CONFIG.googleScriptUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action:action}, payload))
    });
    const data = await res.json();
    if(!data || data.ok !== true) throw new Error('server-error');
    return data;
  }catch(err){
    queueSync(action, payload);
    return {ok:false, queued:true};
  }
}
async function flushSyncQueue(){
  if(DEMO_MODE) return;
  let q = [];
  try{ q = JSON.parse(localStorage.getItem('b9_syncQueue')||'[]'); }catch(e){ return; }
  if(q.length===0) return;
  const remaining = [];
  for(const item of q){
    try{
      const res = await fetch(CONFIG.googleScriptUrl, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(Object.assign({action:item.action}, item.payload))
      });
      const data = await res.json();
      if(!data || data.ok !== true) remaining.push(item);
      else showSyncedToast();
    }catch(e){ remaining.push(item); }
  }
  localStorage.setItem('b9_syncQueue', JSON.stringify(remaining));
  updateSyncBadge();
}
function showSyncedToast(){
  const el = document.getElementById('syncBadge');
  const old = el.textContent;
  el.classList.remove('hidden'); el.textContent = '✅ Đã đồng bộ';
  setTimeout(updateSyncBadge, 2000);
}
window.addEventListener('online', flushSyncQueue);
setInterval(flushSyncQueue, 20000);

/* =========================================================
   XP TOAST + PROGRESS
========================================================= */
function xpToast(text){
  const d = document.createElement('div');
  d.className='xp-toast'; d.textContent = text;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 1800);
}
function requiredDoneCount(){
  return REQUIRED_ACTIVITIES.filter(a => S.completedActivities[a]).length;
}
function progressPercent(){
  return Math.round(100*requiredDoneCount()/REQUIRED_ACTIVITIES.length);
}
function updateTopbar(){
  const outer = document.getElementById('topProgressOuter');
  const inner = document.getElementById('topProgressInner');
  const xpStat = document.getElementById('xpStat');
  if(S.studentId){
    outer.style.display='block'; xpStat.style.display='flex';
    inner.style.width = progressPercent()+'%';
    document.getElementById('xpVal').textContent = S.xp;
  }
}
function recordActivity(activityId, data){
  const prev = S.completedActivities[activityId];
  const attempts = Number.isFinite(data.attempts) ? data.attempts : ((prev?prev.attempts:0) + 1);

  // Nếu cùng một Activity được ghi lại, thay thế điểm/XP cũ thay vì cộng lặp.
  // Điều này giúp dữ liệu local khớp với RESPONSES (mỗi StudentKey + ActivityID chỉ có 1 dòng).
  if(prev){
    S.score = Math.max(0, S.score - (Number(prev.score)||0));
    S.xp = Math.max(0, S.xp - (Number(prev.xp)||0));
  }

  S.completedActivities[activityId] = Object.assign({attempts, time:new Date().toISOString()}, data);
  S.score += (Number(data.score)||0);
  S.xp += (Number(data.xp)||0);
  if(data.xp) xpToast('⭐ +'+data.xp+' XP');
  S.lastActivity = new Date().toISOString();
  saveLocal();
  updateTopbar();
  apiPost('submit', {
    studentKey:S.studentKey, lessonId:CONFIG.lessonId, studentId:S.studentId,
    activityId, answer: JSON.stringify(data.answer!==undefined?data.answer:null),
    correct: !!data.correct, attempts, score:data.score||0, xp:data.xp||0,
    timeSpent:data.timeSpent||0
  });
}

/* =========================================================
   ROUTER
========================================================= */
const app = document.getElementById('app');
function go(page){
  S.page = page; saveLocal();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
  if(S.page==='checkin') return renderCheckin();
  if(S.page==='p1') return renderP1();
  if(S.page==='p2') return renderP2();
  if(S.page==='p3') return renderP3();
  if(S.page==='p4') return renderP4();
  if(S.page==='p5') return renderP5();
  if(S.page==='complete') return renderComplete();
}
function pageNav(current){
  const labels = [['p1','🕵️ Trang 1'],['p2','⚠️ Trang 2'],['p3','🦠 Trang 3'],['p4','🛡 Trang 4'],['p5','🏁 Trang 5']];
  return '<div class="progress-steps" role="list" aria-label="Tiến trình bài học">' +
    labels.map(([id,label])=>{
      const idx = labels.findIndex(l=>l[0]===id);
      const curIdx = labels.findIndex(l=>l[0]===current);
      let cls = idx < curIdx ? 'done' : (idx===curIdx?'now':'');
      return '<div class="progress-step '+cls+'" title="'+label+'"></div>';
    }).join('') + '</div>';
}

/* =========================================================
   CHECK-IN
========================================================= */
let ROSTER_CACHE = null;
async function loadRoster(){
  if(ROSTER_CACHE) return ROSTER_CACHE;
  if(DEMO_MODE){ ROSTER_CACHE = DEMO_STUDENTS; return ROSTER_CACHE; }
  try{
    const data = await apiGet({action:'roster', schoolYear:CONFIG.schoolYear, lessonId:CONFIG.lessonId});
    if(data && data.ok && Array.isArray(data.roster)){ ROSTER_CACHE = data.roster; return ROSTER_CACHE; }
  }catch(e){}
  ROSTER_CACHE = DEMO_STUDENTS;
  return ROSTER_CACHE;
}
function renderCheckin(){
  app.innerHTML = `
  <div class="card" style="text-align:center;background:linear-gradient(180deg,#0f2440,#15325a);color:#fff">
    <div class="eyebrow" style="color:#9fe8f6">TIN HỌC ${CONFIG.grade}</div>
    <h1 style="font-size:26px">🛡️ ${CONFIG.lessonName}</h1>
    <p style="color:#cfe0f5">Giáo viên: <strong>${CONFIG.teacherName}</strong> · Thời lượng: ${CONFIG.expectedMinutes} phút</p>
  </div>
  <div class="card">
    <div class="eyebrow">BƯỚC 1</div>
    <h3>Chọn lớp</h3>
    <select id="selLop" aria-label="Chọn lớp"><option value="">— Chọn lớp —</option></select>
  </div>
  <div class="card hidden" id="cardTen">
    <div class="eyebrow">BƯỚC 2</div>
    <h3>Chọn họ và tên</h3>
    <select id="selTen" aria-label="Chọn họ và tên"><option value="">— Chọn tên —</option></select>
  </div>
  <div class="card hidden" id="cardConfirm"></div>
  `;
  loadRoster().then(roster=>{
    const classes = [...new Set(roster.map(r=>r.Lop||r.lop))].sort();
    const selLop = document.getElementById('selLop');
    classes.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; selLop.appendChild(o); });
    selLop.addEventListener('change', ()=>{
      const lop = selLop.value;
      const cardTen = document.getElementById('cardTen');

async function onSelectStudent(){
  const selLop = document.getElementById('selLop');
  const selTen = document.getElementById('selTen');
  const lop = selLop.value, sid = selTen.value;
  if(!sid) return;
  const hoTen = selTen.options[selTen.selectedIndex].textContent;
  const studentKey = `${CONFIG.lessonId}_${CONFIG.schoolYear}_${sid}`;
  const local = loadLocal(studentKey);
  const box = document.getElementById('cardConfirm');
  box.classList.remove('hidden');
  let welcomeBack = null;
  if(local && local.completedActivities && Object.keys(local.completedActivities).length>0 && !local.completeTime){
    welcomeBack = local;
  } else if(!DEMO_MODE){
    try{
      const data = await apiGet({action:'loadProgress', lessonId:CONFIG.lessonId, studentId:sid, schoolYear:CONFIG.schoolYear});
      if(data && data.ok && data.progress){ welcomeBack = data.progress; }
    }catch(e){}
  }
  if(welcomeBack){
    const pct = Math.round(100*(welcomeBack.completedActivities?Object.keys(welcomeBack.completedActivities).filter(a=>REQUIRED_ACTIVITIES.includes(a)).length:0)/REQUIRED_ACTIVITIES.length);
    box.innerHTML = `
      <p>👋 Chào mừng em quay lại!</p>
      <p class="small">Tiến độ lần trước: <strong>${pct}%</strong></p>
      <div class="pill">👤 ${hoTen}</div> <div class="pill">🏫 ${lop}</div>
      <div style="margin-top:14px"><button class="btn btn-cyan btn-block" id="btnContinue">TIẾP TỤC ▶</button></div>
    `;
    document.getElementById('btnContinue').onclick = ()=>{
      S = Object.assign(S, welcomeBack, {studentId:sid, hoTen, lop, studentKey});
      if(!S.startTime) S.startTime = new Date().toISOString();
      saveLocal(); go(S.page && S.page!=='checkin' ? S.page : 'p1');
    };
  } else {
    box.innerHTML = `
      <div class="pill">👤 ${hoTen}</div> <div class="pill">🏫 ${lop}</div>
      <div style="margin-top:14px"><button class="btn btn-primary btn-block" id="btnStart">BẮT ĐẦU NHIỆM VỤ 🛡️</button></div>
    `;
    document.getElementById('btnStart').onclick = ()=>{
      S = {studentId:sid, hoTen, lop, studentKey, page:'p1', startTime:new Date().toISOString(), lastActivity:new Date().toISOString(),
           completedActivities:{}, score:0, xp:0, mindmap:{"Nguy cơ":[],"Malware":[],"Phòng tránh":[]}, exitTicket:null, completeTime:null};
      saveLocal();
      apiPost('start', {studentKey, lessonId:CONFIG.lessonId, studentId:sid, hoTen, lop, schoolYear:CONFIG.schoolYear});
      go('p1');
    };
  }
}

function renderGame1(){
  const done = S.completedActivities['B9_RISK_MESSAGE'];
  const el = document.getElementById('game1card');
  el.innerHTML = `
    <h3>💬 Game 1 — Tình huống tin nhắn</h3>
    <div class="chat-frame">
      <div class="msg-bubble link">⚠️ "Tài khoản của bạn sắp bị khóa! Bấm ngay vào đây để xác minh: example.invalid/verify"</div>

      <button type="button" class="choice" data-c="verify">☎ Xác minh bằng cách khác</button>
    </div>
    <div id="g1step2" class="hidden" style="margin-top:14px">

      <div class="grid2" id="g1signs">

        <button type="button" class="choice" data-s="url">Đường dẫn lạ</button>
        <button type="button" class="choice" data-s="info">Yêu cầu thông tin cá nhân</button>

      </div>
      <button type="button" class="btn btn-primary" id="g1submit" style="margin-top:10px" disabled>Xác nhận</button>
      <div id="g1inlineFeedback" class="small" style="margin-top:8px"></div>
    </div>
    <div id="g1feedback"></div>
  `;

  // Trạng thái đã hoàn thành: khóa hoạt động và hiển thị kết quả cũ.
  if(done){
    const savedChoice = done.answer && done.answer.choice;
    const savedSigns = new Set((done.answer && done.answer.signs) || []);
    el.querySelectorAll('.choice[data-c]').forEach(b=>{
      if(b.dataset.c===savedChoice) b.classList.add(done.correct?'correct':'incorrect');
      b.disabled=true;
    });
    document.getElementById('g1step2').classList.remove('hidden');
    el.querySelectorAll('#g1signs .choice').forEach(b=>{
      if(savedSigns.has(b.dataset.s)) b.classList.add('selected');
      b.disabled=true;
    });
    const submitBtn = document.getElementById('g1submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Đã xác nhận ✅';
    document.getElementById('g1feedback').innerHTML = feedbackHTML(done.correct,
      done.correct ? '✅ Chính xác. Đây là một lựa chọn an toàn.' : 'Hoạt động đã được ghi nhận.');
    return;
  }

  let chosenChoice = null;
  let chosenSigns = new Set();
  let attempts = 0;
  let submitted = false;
  const submitBtn = document.getElementById('g1submit');
  const inlineFb = document.getElementById('g1inlineFeedback');

  function refreshConfirm(){
    // Chỉ cho xác nhận khi đã chọn cách xử lí và ít nhất một dấu hiệu.
    submitBtn.disabled = submitted || !chosenChoice || chosenSigns.size===0;
    if(!submitted){
      inlineFb.textContent = !chosenChoice
        ? 'Chọn cách xử lí trước.'
        : (chosenSigns.size===0 ? 'Sau đó chọn ít nhất một dấu hiệu đáng ngờ.' : 'Sẵn sàng — bấm Xác nhận.');
    }
  }

  el.querySelectorAll('#g1choices .choice').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(submitted) return;
      el.querySelectorAll('#g1choices .choice').forEach(x=>x.classList.remove('selected','correct','incorrect'));
      b.classList.add('selected');
      chosenChoice = b.dataset.c;
      document.getElementById('g1step2').classList.remove('hidden');
      document.getElementById('g1feedback').innerHTML = '';
      refreshConfirm();
    });
  });

  el.querySelectorAll('#g1signs .choice').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(submitted) return;
      b.classList.toggle('selected');
      if(chosenSigns.has(b.dataset.s)) chosenSigns.delete(b.dataset.s);
      else chosenSigns.add(b.dataset.s);
      document.getElementById('g1feedback').innerHTML = '';
      refreshConfirm();
    });
  });

  submitBtn.addEventListener('click', ()=>{
    if(submitted) return;
    if(!chosenChoice || chosenSigns.size===0){
      inlineFb.textContent = '💡 Em cần chọn cách xử lí và ít nhất một dấu hiệu trước khi xác nhận.';
      refreshConfirm();
      return;
    }

    attempts++;
    const safe = (chosenChoice==='check' || chosenChoice==='verify');
    const goodSigns = chosenSigns.has('urgent') && chosenSigns.has('url');
    const correct = safe && goodSigns;
    const feedback = document.getElementById('g1feedback');

    if(!correct){
      feedback.innerHTML = feedbackHTML(false,
        '💡 Chưa chính xác. Em hãy kiểm tra lại cả <strong>cách xử lí</strong> và các dấu hiệu <strong>thúc giục/hù dọa</strong>, <strong>đường dẫn lạ</strong>. Em vẫn có thể sửa lựa chọn rồi thử lại.');
      feedback.scrollIntoView({behavior:'smooth', block:'nearest'});
      return;
    }

    submitted = true;
    el.querySelectorAll('#g1choices .choice').forEach(b=>{
      b.disabled=true;
      b.classList.remove('selected');
      if(b.dataset.c===chosenChoice) b.classList.add('correct');
    });
    el.querySelectorAll('#g1signs .choice').forEach(b=>b.disabled=true);
    submitBtn.disabled = true;
    submitBtn.textContent = 'Đã xác nhận ✅';
    inlineFb.textContent = '';
    feedback.innerHTML = feedbackHTML(true,
      '✅ Chính xác. Kiểm tra nguồn hoặc xác minh bằng một kênh khác trước khi hành động là lựa chọn an toàn.');

    recordActivity('B9_RISK_MESSAGE', {
      answer:{choice:chosenChoice, signs:[...chosenSigns]},
      correct:true,
      attempts,
      score:10,
      xp:10
    });
    checkP1Summary();
    feedback.scrollIntoView({behavior:'smooth', block:'nearest'});
  });

  refreshConfirm();
}

function renderBalance(){
  const el = document.getElementById('act3card');

  el.innerHTML = `<h3>⏰ Hoạt động 3 — Cân bằng thời gian trong ngày (24 giờ)</h3>` +

    `<div id="balFeedback"></div>`;
  function total(){ return BALANCE_CATS.reduce((s,c)=>s+Number(document.getElementById('sl_'+c.k).value),0); }
  function refresh(){
    BALANCE_CATS.forEach(c=>{ document.getElementById('v_'+c.k).textContent = document.getElementById('sl_'+c.k).value+'h'; });
    const t = total();
    document.getElementById('balTotal').textContent = `Tổng: ${t} / 24 giờ` + (t===24?' ✅':' — điều chỉnh để đủ 24 giờ');

  refresh();
  if(done){
    document.getElementById('balFeedback').innerHTML = feedbackHTML(true, 'Không có một con số "chuẩn tuyệt đối" — điều quan trọng là em có sự cân bằng giữa học tập, nghỉ ngơi, vận động, gia đình và Internet.');
    return;
  }
  document.getElementById('balSubmit').onclick = ()=>{
    const t = total();
    if(t!==24){ document.getElementById('balFeedback').innerHTML = feedbackHTML(false,'💡 Tổng chưa đủ 24 giờ, em điều chỉnh lại nhé.'); return; }

    const netHigh = answer.net >= 10;
    document.getElementById('balFeedback').innerHTML = feedbackHTML(!netHigh,
      netHigh ? '💡 Thời gian Internet/Giải trí khá cao, em thử cân nhắc dành thêm thời gian cho vận động, gia đình và giấc ngủ.' :

    document.getElementById('balSubmit').disabled = true;
    BALANCE_CATS.forEach(c=>document.getElementById('sl_'+c.k).disabled=true);
    recordActivity('B9_BALANCE', {answer, correct:true, score:10, xp:10});
    checkP2Next();
  };
}

      b.classList.add(correct?'correct':'incorrect');
      const fb = document.getElementById('allowfb'+sid); fb.style.display='block';
      fb.className='feedback '+(correct?'ok':'hint');
      fb.textContent = correct ? '✅ Lựa chọn phù hợp.' : ('💡 Cân nhắc lại — mức an toàn phù hợp cho tình huống này là '+({go:'🟢 Tiếp tục',check:'🟡 Kiểm tra thêm',stop:'🔴 Dừng lại'}[s.ans])+'.');
      answered[sid]=b.dataset.v; count++; if(correct) correctCount++;
      if(count===ALLOW_SCENARIOS.length){
        recordActivity('B9_SAFE_DOWNLOAD', {answer:answered, correct: correctCount>=3, score: correctCount*4, xp:15});
        checkP4Next();
      }
    };
  });
}

  el.querySelectorAll('[data-branch]').forEach(b=>{

      const branch=b.dataset.branch, kw=b.dataset.kw;
      if(S.mindmap[branch].length>=5) return;
      if(!S.mindmap[branch].includes(kw)) S.mindmap[branch].push(kw);
      refreshChosen(branch); saveLocal();
    };
  });
  el.querySelectorAll('[data-addbranch]').forEach(b=>{
    b.onclick = ()=>{
      const branch=b.dataset.addbranch, key=branch.replace(/\s/g,'');

      const val = inp.value.trim();
      if(val && S.mindmap[branch].length<5 && !S.mindmap[branch].includes(val)){ S.mindmap[branch].push(val); inp.value=''; refreshChosen(branch); saveLocal(); }
    };
  });
  el.addEventListener('click', (e)=>{
    if(e.target.dataset && e.target.dataset.remove){
      const [branch,kw] = e.target.dataset.remove.split('|');
      S.mindmap[branch] = S.mindmap[branch].filter(x=>x!==kw);
      refreshChosen(branch); saveLocal();
    }
  });
  document.getElementById('mmSubmit').onclick = ()=>{
    const total = Object.values(S.mindmap).reduce((s,a)=>s+a.length,0);
    if(total<3){ document.getElementById('mmFb').innerHTML = feedbackHTML(false,'💡 Em chọn thêm ít nhất vài từ khóa cho các nhánh nhé.'); return; }

    document.getElementById('mmFb').innerHTML = feedbackHTML(true,'✅ Đã lưu sơ đồ tư duy của em.');
    el.querySelectorAll('[data-branch],[data-addbranch],input').forEach(x=>x.disabled=true);
  };
}

function fmtDuration(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+' phút '+String(s).padStart(2,'0')+' giây';
}
function onFinish(){
  const start = new Date(S.startTime).getTime();
  const now = Date.now();
  const durationSeconds = Math.max(0, Math.round((now-start)/1000));
  const fastFinish = durationSeconds < CONFIG.fastFinishMinutes*60;
  S.completeTime = new Date().toISOString();
  S.durationSeconds = durationSeconds; S.fastFinish = fastFinish;
  saveLocal();
  if(fastFinish){ showFastFinishWarning(durationSeconds); }
  else { completeStudent(durationSeconds, fastFinish); }
}

    <h3>📚 Tìm hiểu thêm</h3>
    <div class="link-list">
      <a href="https://support.microsoft.com/en-us/windows/security/threat-malware-protection/virus-and-threat-protection-in-the-windows-security-app" target="_blank" rel="noopener noreferrer">🔗 Microsoft Support – Virus & threat protection</a>
      <a href="https://www.microsoft.com/en-us/wdsi" target="_blank" rel="noopener noreferrer">🔗 Microsoft Defender – Security Intelligence</a>
      <a href="https://www.unicef.org/vietnam/vi/b%C3%A1o-c%C3%A1o/an-to%C3%A0n-tr%E1%BB%B1c-tuy%E1%BA%BFn-cho-tr%E1%BA%BB-em" target="_blank" rel="noopener noreferrer">🔗 UNICEF Việt Nam – An toàn trực tuyến cho trẻ em</a>
      <a href="https://khonggianmang.vn" target="_blank" rel="noopener noreferrer">🔗 Cổng thông tin an toàn không gian mạng quốc gia (NCSC)</a>
    </div>
    <footer class="note">Giao diện Windows Security hiện tại có thể khác hình trong SGK do phiên bản Windows thay đổi.</footer>
  </div>
  <button class="btn btn-outline" onclick="go('p5')">◀ Xem lại Trang 5</button>
  `;
  const positions = [[150,40],[280,150],[20,150]];
  let svg = `<svg viewBox="0 0 300 220" style="width:100%;max-width:340px;background:#f8fbff;border-radius:12px;border:1px solid var(--border)"><circle cx="150" cy="150" r="34" fill="#0f2440"/><text x="150" y="146" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">AN TOÀN</text><text x="150" y="158" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">MẠNG</text>`;
  Object.keys(S.mindmap).forEach((b,i)=>{
    const [x,y]=positions[i];
    svg += `<line x1="150" y1="150" x2="${x}" y2="${y}" stroke="#22d3ee" stroke-width="2"/><circle cx="${x}" cy="${y}" r="26" fill="#eafcff" stroke="#0891b2" stroke-width="2"/><text x="${x}" y="${y+3}" text-anchor="middle" font-size="8" fill="#0f2440" font-weight="700">${b}</text>`;
  });
  svg += `</svg>`;
  document.getElementById('finalMindmap').innerHTML = svg;
}

/* =========================================================
   TEACHER MODE
========================================================= */
document.getElementById('teacherBtn').addEventListener('click', openTeacherLogin);
function openTeacherLogin(){
  const overlay = document.createElement('div'); overlay.className='modal-overlay'; overlay.id='teacherOverlay';
  overlay.innerHTML = `<div class="modal-box">
    <h3>👨‍🏫 Teacher Mode</h3>
    <label for="teacherPass">Nhập mã giáo viên</label>
    <input type="text" id="teacherPass" placeholder="Mã giáo viên">
    ${DEMO_MODE ? '<p class="small" style="color:var(--warn-dark)">Demo Mode: mã kiểm thử phía trình duyệt không phải cơ chế bảo mật.</p>' : ''}
    <div id="teacherLoginErr" class="feedback hint hidden"></div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn btn-outline" id="teacherCancel">Hủy</button>
      <button class="btn btn-primary" id="teacherSubmit">Đăng nhập</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('teacherCancel').onclick = ()=>overlay.remove();
  document.getElementById('teacherSubmit').onclick = async ()=>{
    const pass = document.getElementById('teacherPass').value.trim();
    const errEl = document.getElementById('teacherLoginErr');
    if(DEMO_MODE){
      if(pass===CONFIG.teacherCode){ overlay.remove(); openTeacherDashboard(buildDemoTeacherData()); }
      else { errEl.classList.remove('hidden'); errEl.textContent = '❌ Sai mã giáo viên.'; }
      return;
    }
    try{
      const data = await apiGet({action:'teacherData', lessonId:CONFIG.lessonId, password:pass, schoolYear:CONFIG.schoolYear});
      if(data && data.ok){ overlay.remove(); openTeacherDashboard(data); }
      else { errEl.classList.remove('hidden'); errEl.textContent = '❌ Sai mã giáo viên hoặc chưa kết nối được máy chủ.'; }
    }catch(e){ errEl.classList.remove('hidden'); errEl.textContent = '❌ Không thể kết nối máy chủ. Kiểm tra CONFIG.googleScriptUrl.'; }
  };
}
function buildDemoTeacherData(){
  const students = DEMO_STUDENTS.map(d=>{
    const key = `${CONFIG.lessonId}_${CONFIG.schoolYear}_${d.StudentID}`;
    const local = loadLocal(key);
    const reqDone = local ? Object.keys(local.completedActivities||{}).filter(a=>REQUIRED_ACTIVITIES.includes(a)).length : 0;
    return {
      StudentID:d.StudentID, HoTen:d.HoTen, Lop:d.Lop,
      Progress: local? Math.round(100*reqDone/REQUIRED_ACTIVITIES.length) : 0,
      Score: local? local.score : 0, XP: local? local.xp : 0,
      DurationSeconds: local? (local.durationSeconds||0) : 0,
      FastFinish: local? !!local.fastFinish : false,
      Completed: local? !!local.completeTime : false,
      Understanding: local && local.exitTicket ? local.exitTicket.understanding : null,
      ExitTicket: local? local.exitTicket : null,
      Mindmap: local? local.mindmap : null
    };
  });
  return {ok:true, demo:true, students};
}
function openTeacherDashboard(data){
  const students = data.students || [];
  const total = students.length;
  const completed = students.filter(s=>s.Completed).length;
  const inProgress = total-completed;
  const avgScore = total? Math.round(students.reduce((a,s)=>a+(s.Score||0),0)/total) : 0;
  const avgDuration = total? Math.round(students.reduce((a,s)=>a+(s.DurationSeconds||0),0)/total) : 0;
  const fastCount = students.filter(s=>s.FastFinish).length;
  const understandVals = students.map(s=>s.Understanding).filter(Boolean);
  const avgUnderstand = understandVals.length ? (understandVals.reduce((a,v)=>a+Number(v),0)/understandVals.length).toFixed(1) : '—';
  const overlay = document.createElement('div'); overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal-box wide">
    <h2>📊 Dashboard — ${CONFIG.lessonName}</h2>
    ${data.demo ? '<p class="small" style="color:var(--warn-dark)">Demo Mode: chỉ hiển thị dữ liệu đã lưu trên thiết bị này.</p>':''}
    <div class="grid3" style="margin:14px 0">
      <div class="stat-card"><div class="num">${total}</div><div class="lbl">👥 Tổng học sinh</div></div>
      <div class="stat-card"><div class="num">${completed}</div><div class="lbl">✅ Đã hoàn thành</div></div>
      <div class="stat-card"><div class="num">${inProgress}</div><div class="lbl">⏳ Đang thực hiện</div></div>
      <div class="stat-card"><div class="num">${avgScore}</div><div class="lbl">📊 Điểm trung bình</div></div>
      <div class="stat-card"><div class="num">${Math.round(avgDuration/60)}p</div><div class="lbl">🕒 Thời gian trung bình</div></div>
      <div class="stat-card"><div class="num">${fastCount}</div><div class="lbl">⚡ Hoàn thành &lt;10 phút</div></div>
      <div class="stat-card"><div class="num">${avgUnderstand}</div><div class="lbl">🧠 Mức hiểu trung bình</div></div>
      <div class="stat-card"><div class="num" style="font-size:14px">Windows Security</div><div class="lbl">❓ Phần khó nhất (mẫu)</div></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <select id="tfLop"><option value="">Tất cả lớp</option>${[...new Set(students.map(s=>s.Lop))].map(l=>`<option value="${l}">${l}</option>`).join('')}</select>
      <select id="tfStatus"><option value="">Tất cả</option><option value="done">Đã hoàn thành</option><option value="pending">Chưa hoàn thành</option></select>
      <input type="text" id="tfSearch" placeholder="Tìm tên...">
    </div>
    <div class="table-wrap"><table id="teacherTable">
      <thead><tr><th>STT</th><th>Họ tên</th><th>Lớp</th><th>Tiến độ</th><th>Điểm</th><th>XP</th><th>Thời gian</th><th>Hiểu bài</th><th>Fast</th><th>Exit</th><th>Chi tiết</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <div style="margin-top:14px;text-align:right"><button class="btn btn-outline" id="teacherClose">Đóng</button></div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('teacherClose').onclick = ()=>overlay.remove();
  function renderTable(){
    const lop = document.getElementById('tfLop').value;
    const status = document.getElementById('tfStatus').value;
    const q = document.getElementById('tfSearch').value.toLowerCase();
    const rows = students.filter(s=>{
      if(lop && s.Lop!==lop) return false;
      if(status==='done' && !s.Completed) return false;
      if(status==='pending' && s.Completed) return false;
      if(q && !(s.HoTen||'').toLowerCase().includes(q)) return false;
      return true;
    });
    document.querySelector('#teacherTable tbody').innerHTML = rows.map((s,i)=>`
      <tr>
        <td>${i+1}</td><td>${s.HoTen}</td><td>${s.Lop}</td><td>${s.Progress||0}%</td>
        <td>${s.Score||0}</td><td>${s.XP||0}</td><td>${Math.round((s.DurationSeconds||0)/60)}p</td>
        <td>${s.Understanding||'—'}</td><td>${s.FastFinish?'⚡':''}</td>
        <td>${s.ExitTicket?'✅':'—'}</td>
        <td><button class="btn btn-outline" style="min-height:32px;padding:4px 10px;font-size:12px" data-detail="${i}">Xem</button></td>
      </tr>`).join('');
    document.querySelectorAll('[data-detail]').forEach(b=>{
      b.onclick = ()=>showStudentDetail(rows[b.dataset.detail]);
    });
  }
  document.getElementById('tfLop').onchange = renderTable;
  document.getElementById('tfStatus').onchange = renderTable;
  document.getElementById('tfSearch').oninput = renderTable;
  renderTable();
}
function showStudentDetail(s){
  const overlay = document.createElement('div'); overlay.className='modal-overlay';
  const mm = s.Mindmap || {};
  overlay.innerHTML = `<div class="modal-box">
    <h3>${s.HoTen} — ${s.Lop}</h3>
    <p class="small">Tiến độ: ${s.Progress||0}% · Điểm: ${s.Score||0} · XP: ${s.XP||0} ${s.FastFinish?'⚡ Hoàn thành nhanh':''}</p>
    <h4>Sơ đồ tư duy</h4>
    ${Object.keys(mm).length? Object.keys(mm).map(b=>`<p><strong>${b}:</strong> ${(mm[b]||[]).join(', ')||'—'}</p>`).join('') : '<p class="small">Chưa có dữ liệu.</p>'}
    ${s.ExitTicket ? `<h4>Exit Ticket</h4>
      <p><strong>Hiểu rõ nhất:</strong> ${s.ExitTicket.learned||'—'}</p>
      <p><strong>Khó nhất:</strong> ${(s.ExitTicket.difficultPart||[]).join(', ')||'—'}</p>
      <p><strong>Vận dụng:</strong> ${s.ExitTicket.application||'—'}</p>
      <p><strong>Câu hỏi thêm:</strong> ${s.ExitTicket.question||'—'}</p>` : ''}
    <div style="text-align:right;margin-top:10px"><button class="btn btn-outline" id="detailClose">Đóng</button></div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('detailClose').onclick = ()=>overlay.remove();
}

   INIT
========================================================= */
updateSyncBadge();
render();
</script>
