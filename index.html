<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tin học 8 – Bài 4</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10222f;--teal:#0e7c86;--amber:#f2a413;--bg:#eef3f5;--card:#fff;--bad:#c0392b;--ok:#1e8e5a;--mid:#a86b00;--line:#d5dee3}
@media(prefers-color-scheme:dark){:root{--ink:#e8eff3;--bg:#0f1b24;--card:#182835;--line:#2c4252;--teal:#3fb6c1}}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,textarea,select,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--teal);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
header b{flex:1 1 220px}header .bar{flex:0 0 120px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}header .bar i{display:block;height:100%;background:var(--teal)}
.btn{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn.alt{background:transparent;color:var(--teal)}.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
main{max-width:940px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{flex:1 1 150px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;cursor:pointer}
nav button.on{border-color:var(--teal);box-shadow:inset 0 -4px 0 var(--teal)}nav small{display:block;opacity:.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.q{font-weight:600;margin:0 0 10px}.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1 1 200px;border:2px solid var(--line);background:transparent;border-radius:10px;padding:10px;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--teal)}.opt.sel{border-color:var(--teal);background:rgba(14,124,134,.12)}.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:10px 12px;border-left:5px solid var(--mid);background:rgba(242,164,19,.14);border-radius:6px}
.fb.ok{border-color:var(--ok);background:rgba(30,142,90,.14)}.fb small{display:block;opacity:.8;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.two{grid-template-columns:1fr}}
.post{border:1px solid var(--line);border-radius:10px;padding:10px}.post h4{margin:0 0 6px}
.img{background:linear-gradient(135deg,#7fb69e,#2f6f5e);color:#fff;border-radius:8px;padding:22px 8px;text-align:center;margin:6px 0}
mark{background:var(--amber);color:#10222f;border-radius:3px;padding:0 3px}
.prog{height:8px;background:var(--line);border-radius:4px;margin:6px 0 10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--amber)}
.chips span{display:inline-block;margin:3px;padding:5px 11px;border:1px solid var(--teal);border-radius:20px;font-size:14px}
.hot{display:block;width:100%;text-align:left;margin:5px 0;padding:8px;border:2px dashed var(--line);background:transparent;border-radius:8px;cursor:pointer}
.hot.f{border:2px solid var(--bad);background:rgba(192,57,43,.1)}
textarea{width:100%;min-height:64px;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:transparent}
select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);width:100%;margin:6px 0 12px}
.login{max-width:520px;margin:30px auto;text-align:center}.login h1{font-size:22px;margin:4px 0}
.badge{position:fixed;right:8px;bottom:8px;background:var(--amber);color:#10222f;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:600;z-index:9}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}.tw{overflow-x:auto}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.stats div{flex:1 1 130px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.stars button{font-size:20px;border:0;background:transparent;cursor:pointer;opacity:.4}.stars button.on{opacity:1}
label.ck{display:block;margin:4px 0}
</style></head><body>
<div id="app"></div><div class="badge" id="badge" hidden></div>
<script>
/* ================= CONFIG ================= */
const CONFIG = {
    teacherName: "HUỲNH VĂN DIỄN",
    lessonId: "TIN8_BAI4",
    lessonName: "Bài 4. Đạo đức và văn hoá trong sử dụng công nghệ kĩ thuật số",
    schoolYear: "2026-2027",
    teacherCode: "DIEN",
    googleScriptUrl: ""
};
/* ================= NỘI DUNG ================= */
const YN=["🚫 Có vấn đề","✅ Phù hợp","🤔 Cần xem thêm"],TAIL="Hỏi lại: Được phép chưa? Có tôn trọng người tạo nội dung không? Có ảnh hưởng người khác không? Nguồn có hợp lệ không?";
const c2=(id,q,k,fb,h)=>({t:'c',id:'B4_P2_CASE_'+id,q,o:YN,k,fb,h,tail:TAIL});
const c3=(id,q,o,sh,fb)=>({t:'c',id:'B4_P3_'+id,q,o,k:1,fb,h:"Hãy xem em đã tìm hiểu, có quyền sử dụng và tôn trọng bản quyền chưa.",sh});
const qz=(n,q,k,fb)=>({t:'c',id:'B4_QUIZ_Q'+n,q,o:["Phù hợp","Không phù hợp / vi phạm"],k,fb,h:fb,quiz:1});
const SECS=[
{n:"Em sẽ chọn cách nào?",m:10,items:[{t:'c',id:'B4_P1_CASE_AN',why:1,k:-1,
 q:"Khoa chia sẻ ảnh ruộng bậc thang cho An. An muốn đăng ảnh lên mạng xã hội. Em chọn cách nào?",
 pre:`<div class="two"><div class="post"><h4>Cách 1</h4><div class="img">🏞 Ảnh của Khoa</div><p>An <mark>không hỏi ý kiến Khoa</mark>, chỉnh sửa ảnh, đăng lên và viết nội dung <mark>khiến người xem hiểu rằng An đã đến đó</mark>.</p></div><div class="post"><h4>Cách 2</h4><div class="img">🏞 Ảnh của Khoa</div><p>An <mark>xin phép Khoa</mark>, chỉnh sửa ảnh rồi đăng và <mark>ghi rõ người chụp</mark>.</p></div></div>`,
 o:["Cách 1","Cách 2"],f:["💡 Khoa chưa đồng ý, ảnh không ghi người chụp và nội dung làm người xem hiểu sai.","✅ An đã xin phép, ghi rõ người chụp và không gây hiểu nhầm."],
 after:"Khi sử dụng công nghệ số, điều gì có thể khiến một hành động trở nên chưa đúng?"}]},
{n:"Thám tử hành vi số",m:20,items:[
 c2('CINEMA',"Quay phim trong rạp chiếu phim.",0,"Đây là nơi không cho phép quay phim.","Hãy xem nơi đó có cho phép quay phim không."),
 c2('PLACE',"Chụp ảnh ở nơi em chưa biết có được phép chụp hay không.",2,"Cần xem biển báo hoặc hỏi người quản lí trước khi chụp.","Chưa đủ thông tin để kết luận ngay; hãy kiểm tra xem có được phép không."),
 c2('RECORD',"Ghi âm cuộc nói chuyện khi chưa được phép.",0,"Người nói chưa đồng ý cho ghi âm.","Hãy xem những người trong cuộc đã cho phép chưa."),
 c2('RECORD_OK',"Ghi âm buổi thảo luận nhóm sau khi mọi người đồng ý.",1,"Mọi người đã cho phép nên phù hợp.","Ở đây mọi người đã đồng ý, thử xem lại tình huống."),
 c2('COPY',"Sao chép thông tin trên website và coi là của mình.",0,"Nội dung là của người khác nhưng em nhận là của mình.","Hãy nghĩ đến người tạo ra nội dung đó."),
 c2('CRACK',"Dùng phần mềm bẻ khoá.",0,"Em dùng phần mềm khi không có quyền sử dụng.","Hãy xem em có quyền sử dụng phần mềm đó không."),
 c2('PERSONAL',"Đăng thông tin cá nhân của người khác khi chưa được phép.",0,"Thông tin của người khác cần được họ cho phép.","Hãy xem chủ thông tin đã đồng ý chưa."),
 c2('VIOLENCE',"Chia sẻ hoặc livestream nội dung bạo lực.",0,"Nội dung bạo lực ảnh hưởng xấu đến người xem.","Hãy nghĩ đến tác động lên người khác."),
 c2('COPYRIGHT',"Sử dụng tác phẩm số có bản quyền khi chưa được phép.",0,"Tác phẩm có bản quyền cần được phép của người sở hữu.","Hãy xem nguồn và quyền sử dụng có hợp lệ không.")]},
{n:"Lá chắn công dân số",m:20,items:[
 c3('SLIDE',"Em tìm thấy một bài trình chiếu hay trên Internet và muốn dùng.",["Tải về và ghi tên em","Kiểm tra nguồn, quyền sử dụng; xin phép hoặc ghi nguồn khi cần","Sửa vài chỗ rồi nộp như của em"],"©️ Bản quyền + 🔐 Quyền sử dụng","Nội dung trên Internet phần lớn có bản quyền, chỉ dùng khi được phép."),
 c3('CRACK',"Bạn rủ em cài phần mềm bẻ khoá để khỏi phải mua.",["Cài luôn cho tiện","Không cài; chỉ dùng phần mềm khi có quyền sử dụng","Cài rồi không nói ai"],"🔐 Quyền sử dụng","Chỉ sử dụng sản phẩm số khi được phép hoặc có quyền."),
 c3('MUSIC',"Em muốn lấy một bài hát trên mạng làm nhạc nền cho video của mình.",["Dùng luôn vì ai cũng nghe được","Nhớ rằng nội dung trên mạng thường có bản quyền, tìm hiểu quyền sử dụng trước","Cắt ngắn rồi dùng"],"©️ Bản quyền","Phần lớn nội dung trên Internet có bản quyền."),
 c3('KNOW',"Em chưa chắc việc mình định đăng lên mạng có ổn không.",["Cứ đăng, có vấn đề thì xoá","Tìm hiểu thông tin, hỏi thầy cô trước khi đăng","Nhờ bạn đăng hộ"],"🧠 Hiểu biết","Tìm hiểu và trang bị kiến thức giúp tránh vi phạm.")]},
{n:"Xưởng sản phẩm số trung thực",m:25,pre:`<div class="card chips"><p class="q">Các loại sản phẩm số</p><span>📢 Poster/quảng cáo</span><span>📷 Ảnh chụp/chỉnh sửa</span><span>📖 Truyện tự sáng tác</span><span>💬 Bài đăng mạng xã hội/diễn đàn</span><span>⭐ Bài giới thiệu/đánh giá</span><span>✍ Blog</span><span>🎙 Tệp ghi âm</span><span>🎥 Vlog</span><span>🎵 Video âm nhạc</span><span>🎮 Trò chơi tự thiết kế</span></div>`,items:[
 {t:'fix',id:'B4_P4_PRODUCT_FIX'},
 {t:'c',id:'B4_P4_CASE_VIOLENCE',why:1,q:"Bạn quay video hành vi bạo lực trong lớp rồi đăng lên mạng xã hội. Em khuyên bạn thế nào?",o:["Xoá video và không chia sẻ","Đăng thêm cho nhiều người biết","Không sao, cứ để đó"],k:0,fb:"Không quay, đăng nội dung bạo lực lên mạng.",h:"Hãy nghĩ đến người trong video và người xem."},
 {t:'c',id:'B4_P4_CASE_PHOTO',why:1,q:"Một người dùng ảnh em chụp để tham gia cuộc thi mà chưa có sự đồng ý của em. Em nên làm gì?",o:["Liên hệ, yêu cầu họ dừng dùng khi chưa được em đồng ý","Bỏ qua","Lấy ảnh của họ đăng lại"],k:0,fb:"Ảnh do em chụp, người khác cần được em cho phép.",h:"Hãy xem người tạo ảnh đã đồng ý chưa."}]},
{n:"Luyện tập + Exit ticket",m:15,items:[
 qz(1,"Chia sẻ thông tin mua bán động vật hoang dã quý hiếm.",1,"Đây là hành động không phù hợp, vi phạm."),
 qz(2,"Tạo trang cá nhân chia sẻ kinh nghiệm học tập.",0,"Phù hợp nếu nội dung trung thực và tôn trọng người khác."),
 qz(3,"Quay và lan truyền video bạo lực học đường.",1,"Lan truyền bạo lực là không phù hợp."),
 qz(4,"Sáng tác bài thơ về lớp và gửi bạn bè cùng đọc.",0,"Sản phẩm tự sáng tác, phù hợp."),
 qz(5,"Tham gia cá cược bóng đá qua Internet.",1,"Đây là hành vi không phù hợp, vi phạm."),
 qz(6,"Chia sẻ địa chỉ website chứa phim không có bản quyền sử dụng.",1,"Sử dụng nội dung khi chưa được phép là vi phạm bản quyền."),
 {t:'exit',id:'B4_EXIT'}]}];
const ITEMS=SECS.flatMap(s=>s.items),FIX=["📷 Ảnh không ghi nguồn (ảnh của người khác)","🗣 “Tôi vừa đến đây hôm qua!” (gây hiểu nhầm)","🔗 “Theo một trang không rõ nguồn…” (thông tin không đáng tin)","📋 Đoạn giới thiệu chép từ blog khác như của mình","👤 Đăng tên, số điện thoại của bạn khi chưa được phép"],
 FIXES=["Ghi rõ nguồn/người tạo","Xin phép khi cần","Bỏ thông tin gây hiểu nhầm","Dùng nội dung tự tạo","Kiểm tra nội dung trước khi đăng"];
/* ================= LƯU TRỮ ================= */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEMO=!CONFIG.googleScriptUrl,LS='T8B4:',KEY=id=>`${CONFIG.lessonId}_${CONFIG.schoolYear}_${id}`;
const DEMO_ROSTER=[["HS001","Nguyễn An","8A1"],["HS002","Trần Bình","8A1"],["HS003","Lê Chi","8A1"],["HS004","Phạm Dũng","8A2"],["HS005","Võ Em","8A2"]].map(a=>({StudentID:a[0],name:a[1],cls:a[2],year:CONFIG.schoolYear}));
let st=null,sec=0,roster=[],T=null;
const lget=k=>{try{return JSON.parse(localStorage.getItem(LS+k))}catch(e){return null}},lset=(k,v)=>{try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}};
const A=id=>st.ans[id],pct=()=>Math.round(ITEMS.filter(i=>A(i.id)&&A(i.id).d).length/ITEMS.length*100);
const score=()=>{const q=ITEMS.filter(i=>i.quiz);return Math.round(q.reduce((s,i)=>s+((A(i.id)||{}).ok?1:0),0)/q.length*100)/10};
let tmr;function save(id){st.upd=Date.now();st.act=id||st.act;st.sec=sec;st.pct=pct();st.score=score();st.done=st.pct===100;lset(st.key,st);const p=lget('PEND')||[];if(!p.includes(st.key)){p.push(st.key);lset('PEND',p)}clearTimeout(tmr);tmr=setTimeout(sync,600);badge()}
async function api(a,d={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(CONFIG.googleScriptUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:a,...d}),signal:c.signal});const j=await r.json();if(!j.ok)throw new Error(j.error);return j}finally{clearTimeout(t)}}
async function sync(){if(DEMO)return;let p=lget('PEND')||[];for(const k of [...p]){const s=lget(k);if(!s){p=p.filter(x=>x!==k);continue}try{await api('saveProgress',{state:s});p=p.filter(x=>x!==k)}catch(e){break}}lset('PEND',p);badge()}
function badge(){const b=$('#badge'),p=(lget('PEND')||[]).length;b.hidden=!DEMO&&!p;b.textContent=DEMO?'🟡 DEMO MODE':'⏳ Chờ đồng bộ'}
addEventListener('online',sync);
async function start(s){const k=KEY(s.StudentID);let loc=lget(k),cl=null;if(!DEMO){try{const r=await api('loadProgress',{key:k});cl=r.state}catch(e){}}
 st=(cl&&(!loc||cl.upd>loc.upd))?cl:loc;if(!st)st={key:k,sid:s.StudentID,name:s.name,cls:s.cls,year:CONFIG.schoolYear,lesson:CONFIG.lessonId,start:Date.now(),upd:Date.now(),sec:0,act:'',pct:0,ans:{},exit:{ck:[]}};
 sec=st.sec||0;lset(k,st);lset('LAST',{c:s.cls,i:s.StudentID});render()}
function out(){if(st)save();st=null;login()}
async function endSession(){save();if(!DEMO)await sync();alert("Tiến độ của em đã được lưu.\nLần sau em có thể tiếp tục từ đây.");out()}
/* ================= ĐĂNG NHẬP ================= */
async function login(){$('#app').innerHTML='<div class="login card"><p>Đang tải danh sách lớp…</p></div>';
 try{roster=DEMO?DEMO_ROSTER:(await api('getRoster',{schoolYear:CONFIG.schoolYear})).roster;lset('ROSTER',roster)}catch(e){roster=lget('ROSTER')||[]}
 const cls=[...new Set(roster.map(r=>r.cls))].sort(),last=lget('LAST')||{};
 $('#app').innerHTML=`<div class="login card"><div style="font-size:40px">🛡</div><p>BÀI 4</p><h1>${esc(CONFIG.lessonName.replace(/^Bài 4\.\s*/,'').toUpperCase())}</h1><p>Giáo viên: <b>${esc(CONFIG.teacherName)}</b> · Năm học ${esc(CONFIG.schoolYear)}</p>
 <label>Chọn lớp<select id="sc"><option value="">— Chọn lớp —</option>${cls.map(c=>`<option ${c===last.c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
 <label>Chọn họ tên<select id="sn"></select></label><p id="pg"></p>
 <button class="btn" id="go" disabled>Bắt đầu / Tiếp tục bài học</button> <button class="btn alt" onclick="teacher()">👨‍🏫 Teacher Mode</button></div>`;
 const fill=()=>{const l=roster.filter(r=>r.cls===$('#sc').value).sort((a,b)=>a.name.split(' ').pop().localeCompare(b.name.split(' ').pop(),'vi')||a.name.localeCompare(b.name,'vi'));$('#sn').innerHTML='<option value="">— Chọn học sinh —</option>'+l.map(r=>`<option value="${esc(r.StudentID)}" ${r.StudentID===last.i?'selected':''}>${esc(r.name)}</option>`).join('');chk()},
 chk=()=>{const v=$('#sn').value,s=lget(KEY(v));$('#go').disabled=!v;$('#go').textContent=s&&s.pct?'Tiếp tục từ hoạt động đang học':'Bắt đầu bài học';$('#pg').textContent=v&&s&&s.pct?`Chào ${s.name}. Em đã hoàn thành ${s.pct}% bài học.`:''};
 $('#sc').onchange=fill;$('#sn').onchange=chk;fill();$('#go').onclick=()=>start(roster.find(r=>r.StudentID===$('#sn').value))}
/* ================= GIAO DIỆN BÀI HỌC ================= */
function render(){const S=SECS[sec];let h=`<header><b>${esc(CONFIG.lessonName)}</b><span>👤 ${esc(st.name)} · ${esc(st.cls)}</span><span>${pct()}%</span><div class="bar"><i style="width:${pct()}%"></i></div><button class="btn" onclick="endSession()">💾 Lưu &amp; kết thúc</button><button class="btn alt" onclick="out()">👤 Đổi học sinh</button></header><main><nav>${SECS.map((s,i)=>`<button class="${i===sec?'on':''}" onclick="go(${i})">Phần ${i+1}<small>${esc(s.n)} · ~${s.m}′</small></button>`).join('')}</nav><h2>${sec+1}. ${esc(S.n)}</h2>${S.pre||''}`;
 const dn=S.items.filter(i=>A(i.id)&&A(i.id).d).length;if(S.items.length>2)h+=`<div>${Math.min(dn+1,S.items.length)}/${S.items.length}</div><div class="prog"><i style="width:${dn/S.items.length*100}%"></i></div>`;
 for(const it of S.items){h+=it.t==='c'?choice(it):it.t==='fix'?fix(it):exit(it);if(!(A(it.id)&&A(it.id).d))break}
 if(S.items.every(i=>A(i.id)&&A(i.id).d)&&S.items[0].quiz!==undefined)h+=`<div class="card"><b>Điểm quiz: ${score()}/10</b></div>`;
 h+=`<p>${sec>0?'<button class="btn alt" onclick="go(sec-1)">← Phần trước</button> ':''}${sec<4?'<button class="btn" onclick="go(sec+1)">Phần sau →</button>':''}</p></main>`;$('#app').innerHTML=h;window.scrollTo(0,0)}
function go(i){sec=i;save();render()}
function choice(it){const a=A(it.id)||{},sel=a.c!==undefined;let h=`<div class="card"><p class="q">${it.q}</p>${it.pre||''}<div class="opts">${it.o.map((o,i)=>`<button class="opt ${a.c===i?'sel':''}" ${sel?'disabled':''} onclick="pick('${it.id}',${i})">${o}</button>`).join('')}</div>`;
 if(sel&&it.why&&!a.d)h+=`<textarea id="why" placeholder="Vì sao em chọn như vậy? (1–2 câu)"></textarea><p><button class="btn" onclick="why('${it.id}')">Xem phản hồi</button></p>`;
 if(a.d){const ok=a.c===it.k||it.k===-1&&a.c===1,t=it.f?it.f[a.c]:(a.c===it.k?'✅ '+it.fb:'💡 '+it.h+(it.quiz?'':' Gợi ý: '+it.fb.slice(0,0)));
  h+=`<div class="fb ${ok?'ok':''}">${t}${it.sh?`<small>Lá chắn: ${it.sh}. ${it.fb}</small>`:''}${it.quiz&&!ok?'':''}${it.tail?`<small>${it.tail}</small>`:''}</div>`;
  if(a.w)h+=`<p><i>Em viết: ${esc(a.w)}</i></p>`;if(it.after)h+=`<div class="fb ok"><b>${it.after}</b></div>`;
  if(!ok&&!it.quiz&&it.k!==-1)h+=`<p><button class="btn alt" onclick="retry('${it.id}')">Chọn lại</button></p>`}
 return h+'</div>'}
function pick(id,i){const it=ITEMS.find(x=>x.id===id),a=st.ans[id]||(st.ans[id]={n:0});a.c=i;a.n++;a.ok=it.k===-1?null:i===it.k;a.s=a.ok?1:0;if(!it.why)a.d=1;save(id);render()}
function why(id){const v=$('#why').value.trim();if(v.length<3){alert("Em hãy viết 1–2 câu giải thích nhé.");return}const a=A(id);a.w=v;a.d=1;save(id);render()}
function retry(id){const a=A(id);a.c=undefined;a.d=0;save(id);render()}
function fix(it){const a=st.ans[it.id]||(st.ans[it.id]={found:[],fx:[]}),f=a.found;let h=`<div class="card"><p class="q">🛠 Sửa một sản phẩm số chưa tốt</p><p>Bài đăng của một bạn. Bấm vào từng điểm có vấn đề (${f.length}/5).</p>`;
 h+=FIX.map((t,i)=>`<button class="hot ${f.includes(i)?'f':''}" ${a.d?'disabled':''} onclick="found(${i})">${t}</button>`).join('');
 if(f.length===5&&!a.d){h+=`<p class="q">Chọn cách sửa phù hợp:</p>`+FIXES.map((t,i)=>`<label class="ck"><input type="checkbox" ${a.fx.includes(i)?'checked':''} onchange="fixSel(${i},this.checked)"> ${t}</label>`).join('')+`<p><button class="btn" ${a.fx.length<5?'disabled':''} onclick="fixDone()">Sửa sản phẩm</button></p>`}
 if(a.d)h+=`<div class="two"><div class="post"><h4>❌ BEFORE</h4>${FIX.map(x=>`<p>${x}</p>`).join('')}</div><div class="post"><h4>✅ AFTER</h4><p>📷 Ảnh có ghi rõ người chụp, đã xin phép</p><p>🗣 Nội dung đúng sự thật</p><p>🔗 Thông tin đã kiểm tra nguồn</p><p>✍ Nội dung tự viết</p><p>👤 Không đăng thông tin người khác khi chưa được phép</p></div></div>`;
 return h+'</div>'}
function found(i){const a=A('B4_P4_PRODUCT_FIX');if(!a.found.includes(i))a.found.push(i);save('B4_P4_PRODUCT_FIX');render()}
function fixSel(i,v){const a=A('B4_P4_PRODUCT_FIX');a.fx=a.fx.filter(x=>x!==i);if(v)a.fx.push(i);save();render()}
function fixDone(){A('B4_P4_PRODUCT_FIX').d=1;save('B4_P4_PRODUCT_FIX');render()}
function exit(it){const e=st.exit,d=(A(it.id)||{}).d,u=e.u||0;
 return `<div class="card"><p class="q">🎟 Exit ticket</p><label>1. Em học được gì?<textarea oninput="ex('l',this.value)">${esc(e.l)}</textarea></label>
 <label>2. Em chuẩn bị đăng một sản phẩm số có sử dụng ảnh hoặc thông tin của người khác. Trước khi đăng, em sẽ làm những gì?<textarea oninput="ex('ap',this.value)">${esc(e.ap)}</textarea></label>
 <p>3. Mức độ hiểu bài</p><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${n<=u?'on':''}" onclick="ex('u',${n});render()">⭐</button>`).join('')} ${u||''}</div>
 <label>4. Điều em vẫn chưa hiểu<textarea oninput="ex('un',this.value)">${esc(e.un)}</textarea></label>
 <p class="q">🧠 Vẽ sơ đồ tư duy Bài 4 ra giấy</p><ol><li>Viết/vẽ chủ đề trung tâm: “ĐẠO ĐỨC &amp; VĂN HOÁ TRONG SỬ DỤNG CÔNG NGHỆ SỐ”.</li><li>Tạo 3–5 nhánh chính, gợi ý: biểu hiện vi phạm; cách tránh vi phạm; trung thực; sản phẩm số; sử dụng có trách nhiệm.</li><li>Mỗi nhánh chỉ dùng từ khoá ngắn.</li><li>Thêm hình ảnh/icon đơn giản.</li><li>Dùng màu để phân biệt các nhánh.</li></ol>
 ${["Có chủ đề trung tâm","Có 3–5 nhánh chính","Dùng từ khoá thay vì câu dài","Có nhánh con","Có hình ảnh/icon","Nội dung đúng bài học"].map((t,i)=>`<label class="ck"><input type="checkbox" ${e.ck[i]?'checked':''} onchange="st.exit.ck[${i}]=this.checked;save()"> ${t}</label>`).join('')}
 <p><button class="btn ${e.mm?'':'alt'}" onclick="ex('mm',!st.exit.mm);render()">${e.mm?'✓ Em đã hoàn thành mindmap':'✓ Em đã hoàn thành mindmap'}</button></p>
 ${d?'<div class="fb ok">Đã nộp Exit ticket. Cảm ơn em!</div>':'<p><button class="btn" onclick="submitExit()">Nộp Exit ticket</button></p>'}</div>`}
function ex(k,v){st.exit[k]=v;clearTimeout(ex.t);ex.t=setTimeout(()=>save('B4_EXIT'),500)}
async function submitExit(){const e=st.exit;if(!(e.l||'').trim()||!(e.ap||'').trim()||!e.u){alert("Em hãy trả lời câu 1, 2 và chọn mức độ hiểu bài.");return}e.sub=Date.now();st.ans.B4_EXIT={d:1};save('B4_EXIT');if(!DEMO)try{await api('submitExitTicket',{state:st})}catch(x){}render()}
/* ================= TEACHER MODE ================= */
async function teacher(){const code=prompt("Nhập mã giáo viên:");if(!code)return;let rows;
 if(DEMO){if(code!==CONFIG.teacherCode){alert("Sai mã.");return}rows=DEMO_ROSTER.map(r=>{const s=lget(KEY(r.StudentID))||{};return{name:r.name,sid:r.StudentID,cls:r.cls,year:r.year,pct:s.pct||0,sec:s.sec===undefined?'':SECS[s.sec].n,doneN:Object.values(s.ans||{}).filter(a=>a.d).length,score:s.score||'',u:(s.exit||{}).u||'',un:(s.exit||{}).un||'',upd:s.upd?new Date(s.upd).toLocaleString('vi'):''}})}
 else try{rows=(await api('getTeacherDashboard',{code,lessonId:CONFIG.lessonId})).rows}catch(e){alert("Không tải được: "+e.message);return}
 T={rows,q:'',c:'',y:'',s:''};tview()}
function tview(){const R=T.rows,f=R.filter(r=>(!T.q||r.name.toLowerCase().includes(T.q.toLowerCase()))&&(!T.c||r.cls===T.c)&&(!T.y||r.year===T.y)&&(!T.s||(T.s==='0'?!r.pct:T.s==='1'?r.pct>0&&r.pct<100:r.pct>=100))),avg=(a)=>a.length?(a.reduce((x,y)=>x+ +y,0)/a.length).toFixed(1):'–',op=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
 $('#app').innerHTML=`<header><b>👨‍🏫 Teacher Mode</b><button class="btn alt" onclick="T=null;login()">← Thoát</button></header><main><div class="stats"><div>👥 Tổng<br><b>${f.length}</b></div><div>▶ Đang học<br><b>${f.filter(r=>r.pct>0&&r.pct<100).length}</b></div><div>✅ Hoàn thành<br><b>${f.filter(r=>r.pct>=100).length}</b></div><div>📊 Điểm TB<br><b>${avg(f.filter(r=>r.score!=='').map(r=>r.score))}</b></div><div>⭐ Hiểu TB<br><b>${avg(f.filter(r=>r.u).map(r=>r.u))}</b></div></div>
 <input id="tq" placeholder="🔍 Tìm học sinh" value="${esc(T.q)}" style="padding:8px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card)">
 <select id="tc"><option value="">Lọc lớp: tất cả</option>${op([...new Set(R.map(r=>r.cls))].sort(),T.c)}</select><select id="ty"><option value="">Năm học: tất cả</option>${op([...new Set(R.map(r=>r.year))].sort(),T.y)}</select>
 <select id="ts"><option value="">Tất cả trạng thái</option><option value="0" ${T.s==='0'?'selected':''}>Chưa bắt đầu</option><option value="1" ${T.s==='1'?'selected':''}>Đang học</option><option value="2" ${T.s==='2'?'selected':''}>Hoàn thành</option></select>
 <div class="tw"><table><tr><th>Họ tên</th><th>Mã</th><th>Lớp</th><th>Năm</th><th>%</th><th>Phần</th><th>HĐ xong</th><th>Điểm</th><th>Hiểu</th><th>Chưa hiểu</th><th>Cập nhật</th></tr>${f.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.sid)}</td><td>${esc(r.cls)}</td><td>${esc(r.year)}</td><td>${r.pct}%</td><td>${esc(r.sec)}</td><td>${r.doneN}</td><td>${esc(r.score)}</td><td>${esc(r.u)}</td><td>${esc(r.un)}</td><td>${esc(r.upd)}</td></tr>`).join('')}</table></div></main>`;
 $('#tq').oninput=e=>{T.q=e.target.value;const p=e.target.selectionStart;tview();$('#tq').focus();$('#tq').setSelectionRange(p,p)};$('#tc').onchange=e=>{T.c=e.target.value;tview()};$('#ty').onchange=e=>{T.y=e.target.value;tview()};$('#ts').onchange=e=>{T.s=e.target.value;tview()}}
badge();login();sync();
</script></body></html>
